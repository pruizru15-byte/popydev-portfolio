name: Deploy React Portfolio to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-protfolio/package-lock.json

      - name: Instalar dependencias
        working-directory: ./react-protfolio
        run: npm ci

      - name: Compilar React
        working-directory: ./react-protfolio
        run: npm run build

      - name: Instalar LFTP
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Publicar React en cPanel
        run: |
          lftp -c "
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate no;
          open -p ${{ secrets.FTP_PORT }} \
          -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' \
          ${{ secrets.FTP_SERVER }};
          mirror -R ./react-protfolio/dist/ / --delete;
          "
