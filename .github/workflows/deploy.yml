name: Deploy PopyDev

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar LFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Publicar en cPanel
        run: |
          lftp -c "
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          open -p ${{ secrets.FTP_PORT }} -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' ${{ secrets.FTP_SERVER }};
          mirror -R ./ / --exclude .git/ --exclude .github/ --exclude README.md --exclude .cpanel.yml --exclude .gitignore;
          "
